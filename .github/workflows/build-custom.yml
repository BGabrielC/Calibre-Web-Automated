name: Build custom image

on:
  push:
    branches:
      - custom
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: build-custom
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute image name and version
        run: |
          # The fork carries no release tags, so take them from upstream for the version label
          git fetch --quiet --tags https://github.com/crocodilestick/Calibre-Web-Automated.git
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo v0)-custom-${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +'%d-%m-%Y %H:%M')" >> $GITHUB_ENV

      - name: GitHub Container Registry Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:custom
            ${{ env.IMAGE }}:custom-${{ github.sha }}
          build-args: |
            BUILD_DATE=${{ env.BUILD_DATE }}
            VERSION=${{ env.VERSION }}

      - name: Delete old image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: calibre-web-automated
          package-type: container
          min-versions-to-keep: 1
